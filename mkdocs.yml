site_name: provsync
site_description: LLM provider config sync tool
site_url: https://armaniacs.github.io/provsync/
repo_url: https://github.com/armaniacs/provsync
repo_name: armaniacs/provsync
edit_uri: edit/main/docs/

# 内部設計ドキュメントはサイトに含めない
exclude_docs: |
  superpowers/

theme:
  name: material
  language: ja
  font:
    text: "Noto Sans JP"
    code: "Roboto Mono"
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードへ切替
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードへ切替
  features:
    - content.code.copy
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/name:markdown.extensions.toc.slugify_unicode
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            ホーム: Home
            使い方: Usage
            CLI リファレンス: CLI Reference
            バックアップと undo: Backups and Undo
            セキュリティ: Security
            開発者向け: Development
            CHANGELOG: CHANGELOG
  - include-markdown

nav:
  - ホーム: index.md
  - 使い方: usage.md
  - CLI リファレンス: cli.md
  - バックアップと undo: backup.md
  - セキュリティ: security.md
  - 開発者向け: development.md
  - CHANGELOG: changelog.md

extra_css:
  - stylesheets/landing.css
